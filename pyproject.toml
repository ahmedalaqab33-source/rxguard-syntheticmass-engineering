[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rxguard-syntheticmass-engineering"
version = "1.0.0"
description = "Reproducible SyntheticMass engineering audit and renal feasibility gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.5"]
license = "MIT"
authors = [{name = "Ahmed Alaqab"}]
keywords = [
  "clinical-data-science",
  "data-engineering",
  "duckdb",
  "parquet",
  "reproducible-research",
  "data-quality",
  "synthetic-health-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/ahmedalaqab33-source/rxguard-syntheticmass-engineering"
Repository = "https://github.com/ahmedalaqab33-source/rxguard-syntheticmass-engineering"
Documentation = "https://github.com/ahmedalaqab33-source/rxguard-syntheticmass-engineering/tree/main/docs"
Issues = "https://github.com/ahmedalaqab33-source/rxguard-syntheticmass-engineering/issues"

[project.scripts]
rxguard-audit = "rxguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
