name: Engineering checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Verify dependency environment
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Build wheel smoke test
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Unit and preservation tests
        run: python -m unittest discover -s tests -v

      - name: Publication safety audit
        if: matrix.python-version == '3.11'
        run: python scripts/audit_release.py
