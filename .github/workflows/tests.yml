name: Engineering checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: python -m pip install -e .
      - name: Unit and preservation tests
        run: python -m unittest discover -s tests -v
      - name: Publication safety audit
        run: python scripts/audit_release.py
